<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .card   { fill:#161b22; stroke:#30363d; stroke-width:1.5; }
    .agent  { fill:#1f1840; stroke:#7F5AF0; stroke-width:1.8; }
    .t      { fill:#e6edf3; font-size:15px; font-weight:600; text-anchor:middle; }
    .s      { fill:#8b949e; font-size:11.5px; text-anchor:middle; }
    .lbl    { fill:#a5a0ff; font-size:11px; }
    .line   { stroke:#7F5AF0; stroke-width:2; fill:none; }
    .flow   { stroke-dasharray:7 6; animation:dash 0.9s linear infinite; }
    .soft   { stroke:#5b6170; stroke-width:1.6; fill:none; stroke-dasharray:4 5; animation:dash 1.6s linear infinite; }
    .pulse  { animation:pulse 2.6s ease-in-out infinite; }
    @keyframes dash  { to { stroke-dashoffset:-13; } }
    @keyframes pulse { 0%,100% { stroke-opacity:.35; } 50% { stroke-opacity:1; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F5AF0"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6170"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="418" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- Left: order + shared services -->
  <rect class="card" x="25" y="45" width="175" height="54" rx="27"/>
  <text class="t" x="112" y="77">📦 Customer Order</text>

  <rect x="25" y="150" width="175" height="240" rx="12" fill="none" stroke="#30363d" stroke-dasharray="5 4"/>
  <text class="s" x="112" y="172" style="font-weight:600;fill:#c9d1d9">SHARED SERVICES</text>
  <rect class="card" x="40" y="185" width="145" height="58" rx="10"/>
  <text class="t" x="112" y="210" style="font-size:13.5px">🧮 MRPII Engine</text>
  <text class="s" x="112" y="229">BOM · MPS · MRP</text>
  <rect class="card" x="40" y="255" width="145" height="58" rx="10"/>
  <text class="t" x="112" y="280" style="font-size:13.5px">🧠 Ollama · Qwen</text>
  <text class="s" x="112" y="299">reasoning only</text>
  <rect class="card" x="40" y="325" width="145" height="58" rx="10"/>
  <text class="t" x="112" y="350" style="font-size:13.5px">⚡ Disruptions</text>
  <text class="s" x="112" y="369">what-if scenarios</text>

  <!-- Center: agents -->
  <rect class="pulse" x="320" y="20" width="240" height="380" rx="16" fill="#120f24" stroke="#7F5AF0" stroke-width="2"/>
  <text class="s" x="440" y="44" style="font-weight:700;fill:#c3b5ff;font-size:12px">🤖 AUTONOMOUS AGENTS · A2A</text>

  <rect class="agent" x="355" y="62" width="190" height="62" rx="12"/>
  <text class="t" x="450" y="89">🗓️ Production Planning</text>
  <text class="s" x="450" y="109">MPS · MRP · priorities</text>

  <rect class="agent" x="355" y="187" width="190" height="62" rx="12"/>
  <text class="t" x="450" y="214">📦 Inventory</text>
  <text class="s" x="450" y="234">availability · safety stock</text>

  <rect class="agent" x="355" y="312" width="190" height="62" rx="12"/>
  <text class="t" x="450" y="339">🛒 Purchasing</text>
  <text class="s" x="450" y="359">supplier evaluation</text>

  <path class="line flow" d="M450,124 L450,185" marker-end="url(#a)"/>
  <text class="lbl" x="458" y="160">requirements</text>
  <path class="line flow" d="M450,249 L450,310" marker-end="url(#a)"/>
  <text class="lbl" x="458" y="285">shortage · REQUEST</text>
  <path class="line flow" d="M355,343 L337,343 L337,93 L353,93" marker-end="url(#a)"/>
  <text class="lbl" x="331" y="225" transform="rotate(-90 331 225)" text-anchor="middle">agreement / FAILED</text>

  <!-- Left → center -->
  <path class="line flow" d="M200,72 L282,72 L282,93 L318,93" marker-end="url(#a)"/>
  <path class="soft" d="M200,270 L318,270" marker-end="url(#g)"/>
  <text class="s" x="259" y="262">tools · events</text>

  <!-- Right: validation, approval, commit, supplier -->
  <rect class="card" x="665" y="62" width="210" height="58" rx="10"/>
  <text class="t" x="770" y="88">✅ Deterministic</text>
  <text class="s" x="770" y="106">validation</text>

  <rect class="card" x="665" y="150" width="210" height="58" rx="10"/>
  <text class="t" x="770" y="176">👤 Human Approval</text>
  <text class="s" x="770" y="194">approve or reject</text>

  <rect x="665" y="238" width="210" height="48" rx="24" fill="#0f2a1d" stroke="#2ea043" stroke-width="1.8"/>
  <text class="t" x="770" y="267" style="fill:#56d364">✔ COMMIT · plan executed</text>

  <rect class="card" x="665" y="316" width="210" height="58" rx="10"/>
  <text class="t" x="770" y="342">🏢 Supplier Interface</text>
  <text class="s" x="770" y="360">offers per round</text>

  <path class="line flow" d="M545,88 L663,88" marker-end="url(#a)"/>
  <text class="lbl" x="590" y="80">plan</text>
  <path class="line flow" d="M770,120 L770,148" marker-end="url(#a)"/>
  <path class="line flow" d="M770,208 L770,236" marker-end="url(#a)"/>
  <path class="soft" d="M665,179 L610,179 L610,108 L547,108" marker-end="url(#g)"/>
  <text class="s" x="612" y="196" style="text-anchor:start">reject → replan</text>
  <path class="line flow" d="M547,345 L663,345" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="605" y="336" text-anchor="middle">≤ 3 rounds</text>
</svg>
